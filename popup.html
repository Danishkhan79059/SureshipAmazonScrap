<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sureship Amazon Scraper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --brand: #0b4d43;
        --brand-hover: #0d6355;
        --brand-light: #e1f5ee;
        --bg: #f4f6f5;
        --surface: #ffffff;
        --surface-2: #f0f4f3;
        --border: #dce8e5;
        --text-primary: #0d1f1c;
        --text-secondary: #4a6b65;
        --text-muted: #8aaca6;
        --danger: #c0392b;
        --danger-light: #fdf0ee;
        --warning: #d4860b;
        --warning-light: #fef9ec;
        --success: #1d9e75;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --font: "DM Sans", sans-serif;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.09);
      }

      body {
        width: 360px;
        min-height: 320px;
        background: var(--bg);
        font-family: var(--font);
        color: var(--text-primary);
        font-size: 13px;
      }

      .header {
        background: var(--brand);
        padding: 14px 16px 12px;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .header-logo {
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .header-logo img {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }
      .header-text h1 {
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      .header-text p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        margin-top: 2px;
      }

      .body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sec-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.7px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 14px;
      }

      .auth-fields {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-primary);
        font-family: var(--font);
        font-size: 13px;
        outline: none;
      }
      .field input:focus {
        border-color: var(--brand);
        background: var(--surface);
        box-shadow: 0 0 0 3px rgba(11, 77, 67, 0.12);
      }

      .save-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 16px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--brand);
        color: #fff;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .save-btn:hover {
        background: var(--brand-hover);
      }
      .save-btn:active {
        transform: scale(0.98);
      }
      .save-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .save-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .hint {
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.45;
        text-align: center;
      }

      #authMessage {
        font-size: 11px;
        margin-top: 8px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        display: none;
      }
      #authMessage:not(:empty) {
        display: block;
        background: var(--warning-light);
        color: var(--warning);
      }
      #authMessage.success {
        background: var(--brand-light);
        color: var(--brand);
      }
      #authMessage.error {
        background: var(--danger-light);
        color: var(--danger);
      }

      .link-row {
        margin-top: 10px;
        text-align: center;
      }
      .link-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-family: var(--font);
        font-size: 11px;
        cursor: pointer;
        text-decoration: underline;
        padding: 4px;
      }
      .link-btn:hover {
        color: var(--brand);
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 14px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-muted);
      }
      .status-bar .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }
      .status-bar.busy .live-dot {
        background: var(--warning);
        animation: pulse 1.2s infinite;
      }
      .status-bar.error .live-dot {
        background: var(--danger);
        animation: none;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      #statusText {
        color: var(--text-secondary);
        font-weight: 500;
      }
      #statusSub {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toast-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(13, 31, 28, 0.45);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }
      .toast-overlay.show {
        opacity: 1;
        visibility: visible;
      }
      .toast-card {
        width: 100%;
        max-width: 300px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        padding: 16px;
        text-align: center;
      }
      .toast-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .toast-message {
        font-size: 12.5px;
        color: var(--text-secondary);
        margin-bottom: 14px;
        line-height: 1.45;
      }
      .toast-btn {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--brand);
        color: #fff;
        font-family: var(--font);
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-logo">
        <img src="sure.png" alt="Sureship" />
      </div>
      <div class="header-text">
        <h1>Sureship Scraper</h1>
        <p>Amazon Seller Central</p>
      </div>
    </div>

    <div class="body">
      <div>
        <div class="sec-label">Account</div>
        <div class="card">
          <div class="auth-fields">
            <div class="field">
              <label for="loginUsername">Username</label>
              <input id="loginUsername" type="text" placeholder="your username" autocomplete="username" />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
          </div>
          <button type="button" class="save-btn" id="saveToDbBtn">
            <svg viewBox="0 0 24 24">
              <ellipse cx="12" cy="5" rx="9" ry="3" />
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            </svg>
            Push to Sureship
          </button>
          <div id="authMessage"></div>
          <div class="link-row">
            <button type="button" class="link-btn" id="clearSavedLoginBtn">Clear saved login</button>
          </div>
        </div>
      </div>
      <p class="hint">
        Username and password are saved on this computer. While Sureship session is valid (~2 hours), only press
        <b>push to sureship</b>. After session expires, the next save logs in again automatically using saved credentials.
      </p>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="live-dot"></div>
      <span id="statusText">Ready</span>
      <span> · </span>
      <span id="statusSub">Enter credentials and save</span>
    </div>

    <div class="toast-overlay" id="toastOverlay" role="alertdialog" aria-modal="true" aria-hidden="true">
      <div class="toast-card">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-message" id="toastMessage"></div>
        <button type="button" class="toast-btn" id="toastCloseBtn">OK</button>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
